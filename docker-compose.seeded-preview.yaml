name: anabada-dev-seeded

services:
  # 새 MySQL 9.3.0 named volume만 쓰는 로컬 미리보기 데이터베이스다.
  anabada-mysql:
    image: mysql:9.3.0
    environment:
      MYSQL_DATABASE: anabada
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the explicit env file}
    volumes:
      - ./migrations/legacy/001_new_schema.sql:/docker-entrypoint-initdb.d/00-empty-boj-source.sql:ro
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - anabada-dev-seeded_mysql-data:/var/lib/mysql
    networks: [seeded-preview]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  jungol-migrator:
    build: {context: ./migrations, dockerfile: Dockerfile}
    command: ["node", "dist/cli.js", "up", "--require-boj-import"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the explicit env file}
    networks: [seeded-preview]
    depends_on:
      anabada-mysql: {condition: service_healthy}
    restart: "no"

  preview-seeder:
    image: mysql:9.3.0
    entrypoint: ["/bin/sh", "/seeds/seed.sh"]
    environment:
      DB_HOST: anabada-mysql
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the explicit env file}
      DB_NAME: boj_bada
      PREVIEW_SEED: anabada-dev-seeded
    volumes: ["./seeds:/seeds:ro"]
    networks: [seeded-preview]
    depends_on:
      jungol-migrator: {condition: service_completed_successfully}
    restart: "no"

  anabada-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${NEXT_PUBLIC_KAKAO_MAP_API_KEY:-}
    environment:
      APP_ORIGIN: http://localhost:20050
      BACKEND_URL: http://anabada-backend:3000
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: boj_bada
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SOLVED_AC_CLIENT_ID: ${SOLVED_AC_CLIENT_ID:-}
      SOLVED_AC_CLIENT_SECRET: ${SOLVED_AC_CLIENT_SECRET:-}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-anabada-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-anabada-local-minio-dev}
    networks: [seeded-preview]
    depends_on:
      preview-seeder: {condition: service_completed_successfully}
      anabada-backend: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-anabada-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-anabada-local-minio-dev}
    volumes: ["minio-data:/data"]
    networks: [seeded-preview]
    restart: unless-stopped

  anabada-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      additional_contexts: {automatic_scoring: ./shared}
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the explicit env file}
      DB_NAME: boj_bada
      NODE_ENV: development
      ALLOWED_ORIGIN: http://localhost:20050
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the explicit env file}
      WEBHOOK_URL: ""
    networks: [seeded-preview]
    restart: unless-stopped
    depends_on:
      preview-seeder: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bada-nginx:
    # loopback에만 공개하는 로컬 브라우저 진입점이다.
    image: nginx:stable
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:20050:80"]
    networks: [seeded-preview]
    depends_on:
      anabada-frontend: {condition: service_healthy}

volumes:
  minio-data:
  # 기존 dev/prod 데이터와 공유하지 않는 전용 named volume이다.
  anabada-dev-seeded_mysql-data:
    name: anabada-dev-seeded_mysql-data

networks:
  # 다른 Compose 프로젝트와 격리되는 local bridge network다.
  seeded-preview:
    name: anabada-dev-seeded_network
    driver: bridge
