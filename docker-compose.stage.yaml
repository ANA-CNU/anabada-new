services:
  # 배포 전 새 스키마만 순방향으로 적용하는 일회성 작업이다.
  database-migrator:
    build: {context: ./migrations, dockerfile: Dockerfile}
    command: ["node", "dist/cli.js", "up", "--require-boj-import"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    networks: [bada-network]
    depends_on:
      anabada-mysql: {condition: service_healthy}
    restart: "no"
  # Next.js가 웹 페이지를 서버 렌더링합니다. Kakao 키는 이미지 빌드 때 사용합니다.
  anabada-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${NEXT_PUBLIC_KAKAO_MAP_API_KEY:-}
    environment:
      APP_ORIGIN: http://localhost:20050
      BACKEND_URL: http://anabada-backend:3000
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: boj_bada
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SOLVED_AC_CLIENT_ID: ${SOLVED_AC_CLIENT_ID:-}
      SOLVED_AC_CLIENT_SECRET: ${SOLVED_AC_CLIENT_SECRET:-}
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-anabada-local}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-anabada-local-minio-dev}
    networks: [bada-network]
    depends_on:
      database-migrator: {condition: service_completed_successfully}
      anabada-backend: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-anabada-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-anabada-local-minio-dev}
    volumes: ["minio-data:/data"]
    networks: [bada-network]
    restart: unless-stopped

  anabada-backend:
    # 내부 MySQL DNS와 boj_bada 스키마를 고정하고, 선택 Webhook으로 긴급 장애만 알린다.
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      additional_contexts: {automatic_scoring: ./shared}
    ports: ["20031:3000"]
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: boj_bada
      NODE_ENV: stage
      ALLOWED_ORIGIN: http://localhost:20050
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      SOLVED_AC_CLIENT_ID: ${SOLVED_AC_CLIENT_ID:-}
      SOLVED_AC_CLIENT_SECRET: ${SOLVED_AC_CLIENT_SECRET:-}
    networks: [bada-network]
    restart: unless-stopped
    depends_on:
      anabada-mysql: {condition: service_healthy}
      database-migrator: {condition: service_completed_successfully}
  bada-nginx:
    # stage의 공개 진입점이며 내부 서비스 프록시와 외부 DMOJ nginx 네트워크 연결을 담당한다.
    image: nginx:stable
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["20050:80"]
    networks: [bada-network, dmoj_nginx_network]
    depends_on:
      anabada-frontend: {condition: service_healthy}
  anabada-mysql:
    # stage DB는 호스트 bind mount에 보관해 배포 컨테이너 교체 후에도 데이터를 유지한다.
    image: mysql:9.3.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/mysql_data:/var/lib/mysql
    networks: [bada-network]
    restart: unless-stopped
    healthcheck:
      # 의존 서비스가 단순 컨테이너 시작이 아닌 MySQL 응답 가능 시점 이후 시작하도록 보장한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
volumes:
  minio-data:

networks:
  # 기존 호스트 인프라가 제공하는 외부 애플리케이션 네트워크.
  bada-network:
    external: true

  dmoj_nginx_network:
    # DMOJ nginx와 통신해야 하는 공개 프록시에만 연결하는 외부 네트워크.
    external: true
  
