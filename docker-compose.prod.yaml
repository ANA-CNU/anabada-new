services:
  # 배포 전 새 스키마만 순방향으로 적용하는 일회성 작업이다.
  database-migrator:
    build: {context: ./migrations, dockerfile: Dockerfile}
    command: ["node", "dist/cli.js", "up", "--require-boj-import"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      anabada-mysql: {condition: service_healthy}
    restart: "no"
  # 브라우저에 공개되는 정적 화면; Kakao 키는 이미지 빌드 시점에만 주입한다.
  anabada-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_KAKAO_MAP_API_KEY: ${VITE_KAKAO_MAP_API_KEY:-}
    depends_on:
      database-migrator: {condition: service_completed_successfully}
  anabada-middleware:
    # 관리자 인증과 프런트엔드 연결을 중계한다. 운영 도메인 origin만 허용한다.
    build: {context: ./middleware, dockerfile: Dockerfile}
    environment:
      PORT: "80"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      FRONTEND_URL: http://anabada-frontend:20030
      ALLOWED_ORIGIN: https://bada.anacnu.com
    depends_on:
      database-migrator: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  anabada-backend:
    # 내부 MySQL DNS와 boj_bada 스키마를 고정하고, 선택 Webhook으로 긴급 장애만 알린다.
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      additional_contexts: {automatic_scoring: ./shared}
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: boj_bada
      NODE_ENV: production
      ALLOWED_ORIGIN: https://bada.anacnu.com
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      SOLVED_AC_CLIENT_ID: ${SOLVED_AC_CLIENT_ID:-}
      SOLVED_AC_CLIENT_SECRET: ${SOLVED_AC_CLIENT_SECRET:-}
    restart: unless-stopped
    depends_on:
      anabada-mysql: {condition: service_healthy}
      database-migrator: {condition: service_completed_successfully}
  bada-nginx:
    # VM의 80번 포트에서 Compose 내부 서비스로 요청을 전달한다.
    image: nginx:stable
    volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
    depends_on:
      anabada-backend: {condition: service_healthy}
      anabada-middleware: {condition: service_healthy}
  anabada-mysql:
    # 운영 DB는 호스트 bind mount에 보관해 배포 컨테이너 교체 후에도 데이터를 유지한다.
    image: mysql:9.3.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ./database/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./database/mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      # 의존 서비스가 단순 컨테이너 시작이 아닌 MySQL 응답 가능 시점 이후 시작하도록 보장한다.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
