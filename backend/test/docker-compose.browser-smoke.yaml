services:
  anabada-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: browser-smoke-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  jungol-migrator:
    build: { context: ../../migrations, dockerfile: Dockerfile }
    environment:
      DB_PASSWORD: browser-smoke-only
    depends_on:
      anabada-mysql: { condition: service_healthy }
    restart: "no"

  browser-smoke-seed:
    build: { context: ../.., dockerfile: backend/Dockerfile.test }
    command: ["bun", "test/smoke/seed.ts"]
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: browser-smoke-only
      DB_NAME: boj_bada
    depends_on:
      jungol-migrator: { condition: service_completed_successfully }
    restart: "no"

  anabada-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
      additional_contexts: {automatic_scoring: ../../shared}
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: browser-smoke-only
      DB_NAME: boj_bada
      NODE_ENV: test
      ALLOWED_ORIGIN: http://localhost
      JWT_SECRET: browser-smoke-only-session-secret-material
      WEBHOOK_URL: ""
    depends_on:
      browser-smoke-seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio@sha256:e9cf6b99c226e9539ed0f14b6f00e37b07da153c7ba1f4f8709c807574b471ec
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: smoke-minio
      MINIO_ROOT_PASSWORD: smoke-minio-key
    tmpfs:
      - /data:uid=65532,gid=65532

  anabada-frontend:
    build: { context: ../../frontend, dockerfile: Dockerfile.prod }
    environment:
      APP_ORIGIN: http://localhost
      BACKEND_URL: http://anabada-backend:3000
      DB_HOST: anabada-mysql
      DB_PASSWORD: browser-smoke-only
      JWT_SECRET: browser-smoke-only-session-secret-material
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: smoke-minio
      MINIO_SECRET_KEY: smoke-minio-key
    depends_on:
      browser-smoke-seed: { condition: service_completed_successfully }
      anabada-backend: { condition: service_healthy }
      minio: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20030/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 6s
      retries: 30
      start_period: 5s

  bada-nginx:
    image: nginx:stable
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      anabada-backend: { condition: service_healthy }
      anabada-frontend: { condition: service_healthy }

  browser-smoke:
    build: { context: ../.., dockerfile: frontend/test/Dockerfile.browser-smoke }
    network_mode: service:bada-nginx
    environment:
      SMOKE_SESSION_SECRET: browser-smoke-only-session-secret-material
      SMOKE_BASE_URL: http://localhost
      SMOKE_ARTIFACT_DIR: /artifacts
    volumes:
      - ../../test-output/frontend-smoke:/artifacts
    depends_on:
      bada-nginx: { condition: service_started }
    restart: "no"
