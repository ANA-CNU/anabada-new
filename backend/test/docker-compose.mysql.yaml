services:
  anabada-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: integration-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin --protocol=TCP -h127.0.0.1 -uroot ping --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s

  jungol-migrator:
    build: { context: ../.., dockerfile: database/migrator/Dockerfile }
    environment:
      DB_PASSWORD: integration-test-only
    depends_on:
      anabada-mysql: { condition: service_healthy }
    restart: "no"

  backend-sql-test:
    build: { context: ../.., dockerfile: backend/Dockerfile.test }
    environment:
      DB_HOST: anabada-mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: integration-test-only
      DB_NAME: jungol_bada
      NODE_ENV: test
      JWT_SECRET: integration-test-jwt-secret
      ALLOWED_ORIGIN: http://integration.test
      WEBHOOK_URL: ""
    depends_on:
      jungol-migrator: { condition: service_completed_successfully }
    restart: "no"
