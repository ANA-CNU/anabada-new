name: Deploy production
# production 배포는 main에 반영된 commit만 대상으로 한다.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # 이전 배포가 실행 중이면 취소하지 않고 직렬화하여 서버 상태가 섞이지 않게 한다.
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 30
    # GitHub production Environment의 승인·보호 규칙을 통과한 job만 Secret을 읽는다.
    environment: production
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY || secrets.VITE_KAKAO_MAP_API_KEY }}
      # 선택값이며 비어 있으면 backend 긴급 Discord 알림만 비활성화된다.
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      SOLVED_AC_CLIENT_ID: ${{ secrets.SOLVED_AC_CLIENT_ID }}
      SOLVED_AC_CLIENT_SECRET: ${{ secrets.SOLVED_AC_CLIENT_SECRET }}
    steps:
      - name: Verify production runner and required secrets
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ "$RUNNER_NAME" != bada_deploy ]]; then
            printf 'Production deployment requires the bada_deploy runner\n' >&2
            exit 1
          fi
          missing=()
          for key in DB_PASSWORD JWT_SECRET MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Render root environment and deploy
        shell: bash
        run: |
          set +x
          set -euo pipefail
          # GitHub Actions 작업 디렉터리와 독립된 checkout에 운영 MySQL bind mount를 유지한다.
          repository="$HOME/anabada-new"
          if [[ -e "$repository" || -L "$repository" ]]; then
            if [[ ! -d "$repository" ]] || ! git -C "$repository" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              printf 'Deployment repository path is not a Git working tree\n' >&2
              exit 1
            fi
            cd "$repository"
            git fetch --depth 1 origin main
            git reset --hard origin/main
          else
            mkdir -p "$(dirname "$repository")"
            git clone --depth 1 --branch main --single-branch https://github.com/ANA-CNU/anabada-new.git "$repository"
            cd "$repository"
          fi
          bash "$GITHUB_WORKSPACE/scripts/deploy/render-production-env.sh" "$repository/.env"
          unset DB_PASSWORD JWT_SECRET MINIO_ACCESS_KEY MINIO_SECRET_KEY NEXT_PUBLIC_KAKAO_MAP_API_KEY WEBHOOK_URL SOLVED_AC_CLIENT_ID SOLVED_AC_CLIENT_SECRET
          sudo -n docker compose --env-file .env -f docker-compose.prod.yaml config --quiet
          # CI에서 확인된 구버전 Compose/Bake 조합의 이미지 선택 결함을 피한다.
          timeout 1200 sudo -n COMPOSE_BAKE=false docker compose --env-file .env -f docker-compose.prod.yaml build
          timeout 1200 sudo -n docker compose --env-file .env -f docker-compose.prod.yaml run --rm database-migrator
          timeout 60 sudo -n docker compose --env-file .env -f docker-compose.prod.yaml stop anabada-backend
          timeout 1200 sudo -n docker compose --env-file .env -f docker-compose.prod.yaml up -d --no-build --remove-orphans --wait --wait-timeout 180
          # 변경되지 않은 nginx도 이전 backend 컨테이너 IP를 계속 가리킬 수 있어 배포마다 재시작한다.
          timeout 60 sudo -n docker compose --env-file .env -f docker-compose.prod.yaml restart bada-nginx
          sudo -n docker compose --env-file .env -f docker-compose.prod.yaml ps
