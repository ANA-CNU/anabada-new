name: Deploy production
# production 배포는 main에 반영된 commit만 대상으로 한다.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  # 이전 배포가 실행 중이면 취소하지 않고 직렬화하여 서버 상태가 섞이지 않게 한다.
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub production Environment의 승인·보호 규칙을 통과한 job만 Secret을 읽는다.
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JUNGOL_USERNAME: ${{ secrets.JUNGOL_USERNAME }}
      JUNGOL_PASSWORD: ${{ secrets.JUNGOL_PASSWORD }}
      VITE_KAKAO_MAP_API_KEY: ${{ secrets.VITE_KAKAO_MAP_API_KEY }}
      # 선택값이며 비어 있으면 backend/collector 긴급 Discord 알림만 비활성화된다.
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
    steps:
      # 누락된 Secret은 서버 접속이나 임시 파일 생성 전에 이름만 표시하고 즉시 실패시킨다.
      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set +x
          set -euo pipefail
          missing=()
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_KEY DB_PASSWORD JWT_SECRET ADMIN_USERNAME ADMIN_PASSWORD JUNGOL_USERNAME JUNGOL_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then missing+=("$key"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      # Secret으로 단일 .env를 만든 뒤 검증된 commit만 원격 서버에 fast-forward 배포한다.
      - name: Render root environment and deploy
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          secret_dir=$(mktemp -d)
          remote_dir=
          # GitHub-hosted runner는 일회성이므로 별도 known_hosts Secret 없이 첫 host key를 수락한다.
          ssh_options=(-i "$secret_dir/key" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          cleanup() {
            if [[ "$remote_dir" =~ ^/tmp/jungol-deploy\.[a-zA-Z0-9]+$ ]]; then
              # shellcheck disable=SC2029
              timeout 30 ssh "${ssh_options[@]}" "$target" "rm -f '$remote_dir/.env'; rmdir '$remote_dir'" || true
            fi
            rm -f "$secret_dir/key" "$secret_dir/.env"
            rmdir "$secret_dir"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash scripts/deploy/render-production-env.sh "$secret_dir/.env"
          printf '%s\n' "$DEPLOY_KEY" > "$secret_dir/key"
          # Secret을 보내기 전에 원격 작업 트리와 origin/main SHA가 배포 대상과 정확히 일치하는지 확인한다.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "bash -se -- '$DEPLOY_SHA'" <<'PREFLIGHT'
          set -euo pipefail
          cd /home/ana/Desktop/ana/anabada-new
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$1"
          PREFLIGHT
          remote_dir=$(ssh "${ssh_options[@]}" "$target" 'umask 077; mktemp -d /tmp/jungol-deploy.XXXXXXXX')
          [[ "$remote_dir" =~ ^/tmp/jungol-deploy\.[a-zA-Z0-9]+$ ]]
          # 생성된 .env는 저장소가 아닌 권한 0700의 원격 임시 디렉터리를 통해 전달한다.
          # shellcheck disable=SC2029
          tar -C "$secret_dir" -cf - .env |
            ssh "${ssh_options[@]}" "$target" "tar -C '$remote_dir' -xf -"
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$target" "bash -se -- '$remote_dir' '$DEPLOY_SHA'" <<'DEPLOY'
          set -euo pipefail
          transit=$1
          cleanup() { rm -f "$transit/.env" .env.next; rmdir "$transit" 2>/dev/null || true; }
          cd /home/ana/Desktop/ana/anabada-new
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse origin/main)" = "$2"
          git checkout main
          git merge --ff-only "$2"
          test "$(git rev-parse HEAD)" = "$2"
          # 완성된 파일만 0600으로 설치하고 rename하여 부분 작성된 .env가 노출되지 않게 한다.
          install -m 0600 "$1/.env" .env.next
          mv -f .env.next .env
          docker compose --env-file .env -f docker-compose.prod.yaml config --quiet
          timeout 1200 docker compose --env-file .env -f docker-compose.prod.yaml up -d --build --remove-orphans --wait --wait-timeout 180
          docker compose --env-file .env -f docker-compose.prod.yaml ps
          DEPLOY
